[package]
name = "oan-identity-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/OpenAgenet/oan-identity-sidecar"
description = "Local deployment boundary framework for OAN identity adoption"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
oan-protocol = { path = "../oan-protocol-common/crates/oan-protocol" }

oan-did-oan = { path = "../oan-protocol-common/crates/oan-did-oan" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
